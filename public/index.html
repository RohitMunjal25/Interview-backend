<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Interview</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><strong>AI Interview</strong><span id="userName"></span><button id="logoutBtn" class="link" hidden>Logout</button></header><main><p id="notice" role="status"></p>
<section id="loginCard" class="card narrow"><h1>Welcome back</h1><p>Log in to begin your interview.</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Login</button></form><small>Use an already verified account. Signup and OTP verification remain available in Swagger.</small></section>
<section id="setupCard" class="card" hidden><h1>Set up your interview</h1><form id="setupForm"><label>Resume (PDF, DOC, DOCX)<input name="resume" type="file" accept=".pdf,.doc,.docx" required></label><label>Job role from your resume<select id="jobRole" name="jobRole" required disabled><option value="">Upload resume to see suggested roles</option></select></label><label>Difficulty<select name="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><label>Questions<input name="questionCount" type="number" min="1" max="20" value="5" required></label><fieldset><legend>Interview type</legend><label><input type="radio" name="interviewType" value="text" checked> Text</label><label><input type="radio" name="interviewType" value="audio"> Audio (AI speaks; you answer by microphone)</label></fieldset><button>Generate interview</button></form></section>
<section id="interviewCard" class="card" hidden><div class="topline"><span id="progress"></span><span id="modeBadge"></span></div><video id="camera" autoplay muted playsinline></video><h2 id="questionText"></h2><audio id="questionAudio" controls></audio><div id="textAnswer"><textarea id="answerText" placeholder="Write your answer..."></textarea><button id="sendText">Submit answer</button></div><div id="audioAnswer" hidden><p id="recordingStatus">AI is speaking…</p><audio id="answerPreview" controls hidden></audio><div id="voiceReview" hidden><label>Review or edit your answer<textarea id="voiceTranscript" placeholder="Your recorded answer will appear here. You can edit it or type your answer."></textarea></label><button id="submitVoiceText">Submit answer</button><button id="recordAgain" class="link">Record again</button></div></div></section>
<section id="reportCard" class="card" hidden><h1>Interview report</h1><div id="report"></div></section></main><script src="/app.js"></script></body></html>
